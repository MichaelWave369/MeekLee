name: MeekLee puzzle checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install React and build tools
        run: npm install --no-audit --no-fund
      - name: Validate puzzle levels, React build, and offline shell
        run: npm run check

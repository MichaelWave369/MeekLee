name: MeekLee puzzle checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install React and build tools
        run: npm install --no-audit --no-fund
      - name: Validate puzzle levels, React build, and offline shell
        run: npm run check

  phone-browser:
    name: Phone visibility and touch smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for phone tests
        run: npx playwright install --with-deps chromium
      - name: Run viewport and saved-progress tests
        run: npm run test:browser
      - name: Save failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meeklee-phone-debug
          path: test-results/
          if-no-files-found: ignore
